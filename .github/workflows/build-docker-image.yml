name: Build and Push Docker Image

on:
  # Manueller Trigger über GitHub UI
  workflow_dispatch:
    inputs:
      ocpp_version:
        description: 'OCPP Version (1.6 oder 2.0.1)'
        required: true
        default: '1.6'
        type: choice
        options:
          - '1.6'
          - '2.0.1'
  
  # Optional: Bei Push auf main (auskommentiert für manuellen Trigger)
  # push:
  #   branches: [main]
  #   paths:
  #     - 'src/**'
  #     - 'Dockerfile*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_V16: ${{ github.repository_owner }}/microocpp-sim-v16
  IMAGE_NAME_V201: ${{ github.repository_owner }}/microocpp-sim-v201

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU (für ARM64 Cross-Compilation)
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ inputs.ocpp_version == '2.0.1' && env.IMAGE_NAME_V201 || env.IMAGE_NAME_V16 }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCPP_VERSION=${{ inputs.ocpp_version }}
            SIMULATOR_PORT=8000
            CHARGER_ID=depot-charger
            API_PORT=8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Summary
        run: |
          echo "## 🎉 Docker Image erfolgreich gebaut und gepusht!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OCPP Version:** ${{ inputs.ocpp_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.ocpp_version }}" == "1.6" ]]; then
            echo "docker pull ghcr.io/${{ github.repository_owner }}/microocpp-sim-v16:latest" >> $GITHUB_STEP_SUMMARY
          else
            echo "docker pull ghcr.io/${{ github.repository_owner }}/microocpp-sim-v201:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

