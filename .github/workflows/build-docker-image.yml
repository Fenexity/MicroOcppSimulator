name: Build and Push Docker Image

on:
  # Bei Pull Request auf main: Bauen und mit PR-Tag pushen
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile*'
      - '.github/workflows/build-docker-image.yml'
  
  # Bei Push/Merge auf main: Re-tag zu latest
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile*'
      - '.github/workflows/build-docker-image.yml'
  
  # Manueller Trigger
  workflow_dispatch:
    inputs:
      ocpp_version:
        description: 'OCPP Version'
        required: true
        default: '1.6'
        type: choice
        options:
          - '1.6'
          - '2.0.1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_V16: fenexity/microocpp-sim-v16
  IMAGE_NAME_V201: fenexity/microocpp-sim-v201

jobs:
  build-v16:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_V16 }}
          tags: |
            # Bei PR: Tag mit PR-Nummer (pr-123)
            type=ref,event=pr
            # Bei Push auf main: latest + sha + datum
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.event_name != 'pull_request' }}
      
      - name: Build and push OCPP 1.6 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          # Immer pushen - bei PR mit PR-Tag, bei merge mit latest
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCPP_VERSION=1.6
            SIMULATOR_PORT=8000
            CHARGER_ID=depot-charger
            API_PORT=8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-v201:
    runs-on: ubuntu-latest
    # Nur bei manuellem Trigger mit Version 2.0.1
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ocpp_version == '2.0.1'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_V201 }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}
      
      - name: Build and push OCPP 2.0.1 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCPP_VERSION=2.0.1
            SIMULATOR_PORT=8000
            CHARGER_ID=depot-charger
            API_PORT=8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    runs-on: ubuntu-latest
    needs: [build-v16]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "✅ **Image gebaut und mit PR-Tag gepusht**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** \`pr-${{ github.event.pull_request.number }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Nach dem Merge wird das Image automatisch als \`latest\` getaggt." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Image gebaut und als latest gepusht**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/fenexity/microocpp-sim-v16:latest" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
